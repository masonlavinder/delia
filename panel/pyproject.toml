[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "panel"
version = "0.1.0"
description = "Declarative scene schema + renderer daemon for an LED matrix"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "pillow>=9"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["panel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
